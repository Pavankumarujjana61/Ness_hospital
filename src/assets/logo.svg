<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Modern Gradient for Leaves/Hands -->
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Modern Gradient for Cross/Heart -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle (Subtle) -->
  <circle cx="60" cy="60" r="54" fill="#f8fafc" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Left Leaf/Hand Shape -->
  <path d="M 44 26 C 26 36, 24 64, 38 82 C 46 92, 58 98, 60 98 C 60 98, 50 82, 50 68 C 50 48, 56 36, 44 26 Z" 
        fill="url(#greenGradient)" />

  <!-- Right Leaf/Hand Shape (Symmetrical/Complementary) -->
  <path d="M 76 26 C 94 36, 96 64, 82 82 C 74 92, 62 98, 60 98 C 60 98, 70 82, 70 68 C 70 48, 64 36, 76 26 Z" 
        fill="url(#greenGradient)" />

  <!-- Red Cross/Heart Combo in the Center -->
  <g filter="url(#softGlow)">
    <!-- Vertical Bar -->
    <rect x="54" y="44" width="12" height="32" rx="6" fill="url(#redGradient)" />
    <!-- Horizontal Bar -->
    <rect x="44" y="54" width="32" height="12" rx="6" fill="url(#redGradient)" />
    <!-- Center overlay circle to smooth transition -->
    <circle cx="60" cy="60" r="6" fill="#ef4444" />
  </g>
  
  <!-- Subtle Leaf Detail on Top -->
  <path d="M 60 20 C 58 28, 62 28, 60 20 Z" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
